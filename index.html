<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡江食圖 TKU Food Map</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- 頂部 Header -->
    <header class="bg-primary text-white text-center py-4 shadow-sm mb-4">
        <div class="container">
            <h1 class="fw-bold mb-1">🎓 淡江食圖 TKU Food Map</h1>
            <p class="mb-0 opacity-75">淡江學生專屬 · 步行 15 分鐘美食速查地圖</p>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="container my-4">
        <!-- 搜尋列、量身訂做與隨機抽獎按鈕 -->
        <div class="row justify-content-center mb-3">
            <div class="col-md-10 d-flex flex-wrap gap-2 justify-content-center">
                <input type="text" id="search-input" class="form-control form-control-lg rounded-pill shadow-sm flex-grow-1" placeholder="🔍 搜尋店家名稱、學府路、便當、拉麵...">
                <button class="btn btn-outline-success rounded-pill px-3 fw-bold text-nowrap shadow-sm" id="open-only-btn">
                    🟢 只看營業中
                </button>
                <button class="btn btn-warning rounded-pill px-3 fw-bold text-nowrap shadow-sm" data-bs-toggle="modal" data-bs-target="#filterModal">
                    🎯 量身訂做
                </button>
                <button class="btn btn-danger rounded-pill px-3 fw-bold text-nowrap shadow-sm" id="random-pick-btn" data-bs-toggle="modal" data-bs-target="#randomModal">
                    🎲 今天吃什麼？
                </button>
            </div>
        </div>

        <!-- 路段快選標籤 -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3" id="road-buttons">
            <button class="btn btn-primary road-btn active rounded-pill px-3" data-road="全部">全部區域</button>
            <button class="btn btn-outline-primary road-btn rounded-pill px-3" data-road="水源街">水源街</button>
            <button class="btn btn-outline-primary road-btn rounded-pill px-3" data-road="北新路">北新路</button>
            <button class="btn btn-outline-primary road-btn rounded-pill px-3" data-road="大學城">大學城</button>
            <button class="btn btn-outline-primary road-btn rounded-pill px-3" data-road="學府路">學府路</button>
            <button class="btn btn-outline-primary road-btn rounded-pill px-3" data-road="大忠街">大忠街</button>
        </div>

        <!-- 美食種類快選標籤 -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4" id="category-buttons">
            <button class="btn btn-sm btn-outline-secondary category-btn rounded-pill" data-category="全部">全部種類</button>
            <button class="btn btn-sm btn-outline-secondary category-btn rounded-pill" data-category="便當">🍱 便當</button>
            <button class="btn btn-sm btn-outline-secondary category-btn rounded-pill" data-category="拉麵">🍜 麵食拉麵</button>
            <button class="btn btn-sm btn-outline-secondary category-btn rounded-pill" data-category="火鍋">🍲 火鍋</button>
            <button class="btn btn-sm btn-outline-secondary category-btn rounded-pill" data-category="早餐">🥪 早餐早午餐</button>
            <button class="btn btn-sm btn-outline-secondary category-btn rounded-pill" data-category="宵夜">🍗 宵夜小吃</button>
            <button class="btn btn-sm btn-outline-secondary category-btn rounded-pill" data-category="飲料">🧋 飲料甜點</button>
        </div>

        <!-- 筆數統計顯示 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-dark mb-0" id="restaurant-count">載入中...</h5>
        </div>

        <!-- 店家卡片容器 -->
        <div class="row" id="restaurant-list"></div>
    </main>

    <!-- 🎯 量身訂做 Modal 彈出視窗 -->
    <div class="modal fade" id="filterModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">🎯 量身訂做美食篩選器</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">📍 選擇校園區域 / 路段</label>
                        <select class="form-select rounded-3" id="filter-road">
                            <option value="ALL">全部區域</option>
                            <option value="水源街">水源街</option>
                            <option value="北新路">北新路</option>
                            <option value="大學城">大學城</option>
                            <option value="學府路">學府路</option>
                            <option value="大忠街">大忠街</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">🍱 想吃什麼種類？</label>
                        <select class="form-select rounded-3" id="filter-category">
                            <option value="ALL">全部種類</option>
                            <option value="便當">便當 / 快餐</option>
                            <option value="麵">麵食 / 拉麵</option>
                            <option value="火鍋">火鍋 / 鍋物</option>
                            <option value="早餐">早餐 / 早午餐</option>
                            <option value="宵夜">炸雞 / 滷味 / 宵夜</option>
                            <option value="飲料">飲料 / 冰品</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">⭐ 最低 Google 評分要求</label>
                        <select class="form-select rounded-3" id="filter-rating">
                            <option value="0">不限評分</option>
                            <option value="4.0">4.0 ★ 以上 (美味保證)</option>
                            <option value="4.3">4.3 ★ 以上 (超高評價熱門店)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" id="apply-filter-btn" data-bs-dismiss="modal">開始搜尋</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🎲 隨機抽獎 Modal 彈出視窗（支援選區域） -->
    <div class="modal fade" id="randomModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow text-center">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold">🎲 命運抽獎：今天吃什麼？</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4" id="random-modal-body">
                    <!-- 📍 指定區域抽獎下拉選單 -->
                    <div class="mb-3 px-3">
                        <label class="form-label fw-bold text-dark">📍 請選擇要抽哪個區域的美食：</label>
                        <select class="form-select rounded-pill text-center border-danger fw-bold" id="random-road-select">
                            <option value="ALL">🌐 全部區域 (全校園隨機抽)</option>
                            <option value="水源街">📍 水源街專屬</option>
                            <option value="北新路">📍 北新路專屬</option>
                            <option value="大學城">📍 大學城專屬</option>
                            <option value="學府路">📍 學府路專屬</option>
                            <option value="大忠街">📍 大忠街專屬</option>
                        </select>
                    </div>

                    <div id="slot-machine" class="fs-2 fw-bold text-primary my-3">
                        按下按鈕開始抽獎！
                    </div>
                    <div id="random-result-card" class="d-none mt-3"></div>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-danger rounded-pill px-4 fw-bold" id="start-roll-btn">
                        🎰 幫我決定！
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center py-3 text-muted border-top bg-white">
        <small>© 2026 淡江食圖 TKU Food Map | 極速靜態地圖專案</small>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
